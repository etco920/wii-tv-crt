name: CI

on:
  push:
    branches: [main, crt-dark-mode]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Shell helpers against a simulated TV
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 3072000 || { echo "APK is over 3000 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }
      - name: Downloadable test build
        uses: actions/upload-artifact@v4
        with:
          name: wii-tv-crt-test-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-test-reports
          path: |
            launcher/app/build/reports/tests/
            launcher/app/build/reports/lint-results-release.html
